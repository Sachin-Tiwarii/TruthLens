

services:
  api:
    build: ./api
    container_name: truthlens-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./api/meta_model_artifacts:/app/meta_model_artifacts:ro
      - ./config/truthlens_config.json:/app/config/truthlens_config.json:ro
      - api-data:/app/data  # Persists the SQLite users/history DB across container rebuilds
    environment:
      - PORT=8000
      - META_MODEL_ARTIFACTS_DIR=/app/meta_model_artifacts
      - TRUTHLENS_CONFIG_FILE_PATH=/app/config/truthlens_config.json
      - DATABASE_URL=sqlite:////app/data/truthlens_history.db
      # JWT signing key. Set it in backend/.env (see .env.example); the fallback is for local dev only.
      - SECRET_KEY=${SECRET_KEY:-dev_only_insecure_secret_change_me}
      # Comma-separated browser origins allowed to call the API (the frontend dev server).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # - LOG_LEVEL=debug # Optional: for more verbose API logs
    depends_on:
      - npr_deepfakedetection
      - universalfakedetect
      - cross_efficient_vit
      # Add other future video/audio model service names here
    networks:
      - truthlens-network

  # --- Image Model Services ---
  npr_deepfakedetection:
    build:
      context: .
      dockerfile: models/image/npr_deepfakedetection/Dockerfile
    container_name: truthlens-npr_deepfakedetection
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5001
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - truthlens-network

  yermandy_clip_detection:
    build: ./models/image/yermandy_clip_detection
    container_name: truthlens-yermandy-clip-detection
    profiles: ["extra"]  # optional model: start with --profile extra or COMPOSE_PROFILES=extra
    ports:
      - "5002:5002"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5002
      - MODEL_PATH=model_code/weights/model.ckpt
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - truthlens-network

  wavelet_clip_detection:
    build: ./models/image/wavelet_clip_detection
    container_name: truthlens-wavelet-clip-detection
    profiles: ["extra"]  # optional model: start with --profile extra or COMPOSE_PROFILES=extra
    ports:
      - "5003:5003"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5003
      - MODEL_PATH=model_code/weights/clip_wavelet_best.pth
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - truthlens-network

  universalfakedetect:
    build:
      context: .
      dockerfile: models/image/universalfakedetect/Dockerfile
    container_name: truthlens-universalfakedetect
    ports:
      - "5004:5004"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5004
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - truthlens-network

  trufor:
    build: ./models/image/trufor
    container_name: truthlens-trufor
    profiles: ["extra"]  # optional model: start with --profile extra or COMPOSE_PROFILES=extra
    ports:
      - "5005:5005"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5005
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - truthlens-network

  spsl_deepfake_detection:
    build: ./models/image/spsl_deepfake_detection
    container_name: truthlens-spsl-deepfake-detection
    profiles: ["extra"]  # optional model: start with --profile extra or COMPOSE_PROFILES=extra
    ports:
      - "5006:5006"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5006
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - truthlens-network

  ucf_deepfake_detection:
    build: ./models/image/ucf_deepfake_detection
    container_name: truthlens-ucf-deepfake-detection
    profiles: ["extra"]  # optional model: start with --profile extra or COMPOSE_PROFILES=extra
    ports:
      - "5007:5007"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5007
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=false
    networks:
      - truthlens-network

  cross_efficient_vit:
    build:
      context: .
      dockerfile: models/video/cross_efficient_vit/Dockerfile
    container_name: truthlens-cross-efficient-vit
    ports:
      - "7001:7001"
    restart: unless-stopped
    environment:
      - MODEL_PORT=7001
      - PRELOAD_MODEL=false 
      - MODEL_TIMEOUT=900   # Video models might be heavier, allow longer idle time
      - USE_GPU=false       # Ensure CPU operation
      # The following are set within the cross_efficient_vit/Dockerfile,
      # but can be overridden here if needed for different weight files for the same image:
      # - DEFAULT_MODEL_VARIANT="cross_efficient_vit" 
      # - CROSS_EFFICIENT_VIT_MODEL_PATH="/app/model_code/cross-efficient-vit/pretrained_models/cross_efficient_vit.pth"
      # - EFFICIENT_VIT_MODEL_PATH="/app/model_code/efficient-vit/pretrained_models/efficient_vit.pth"
      # - CROSS_EFFICIENT_VIT_CONFIG_PATH="/app/model_code/cross-efficient-vit/configs/architecture.yaml"
      # - EFFICIENT_VIT_CONFIG_PATH="/app/model_code/efficient-vit/configs/architecture.yaml"
      # - FRAMES_PER_VIDEO="15" # If you want to control frame sampling from docker-compose
    networks:
      - truthlens-network
    # Optional: Add resource limits for CPU/memory if this model is resource-intensive
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0' 
    #       memory: 4G

  # --- Placeholder for future audio model service ---
  # example_audio_model_1:
  #   build: ./models/audio/example_audio_model_1
  #   container_name: truthlens-example-audio-model-1
  #   ports:
  #     - "8001:8001"
  #   restart: unless-stopped
  #   # ... environment ...
  #   networks:
  #     - truthlens-network

  # Frontend is not containerized: it lives in ../frontend (Vite, no Dockerfile).
  # Run it separately with `npm run dev` from the frontend folder.
  # frontend:
  #   build: ../frontend
  #   container_name: truthlens-frontend
  #   ports:
  #     - "8888:80"
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   networks:
  #     - truthlens-network

networks:
  truthlens-network:
    driver: bridge

volumes:
  api-data: